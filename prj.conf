CONFIG_PRINTK=y
CONFIG_LOG=y

# Bluetooth Core
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ESP32-DeskKnob"
CONFIG_BT_DEVICE_APPEARANCE=964

# Security Manager Protocol (SMP)
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_L2CAP_TX_FRAG_COUNT=2
CONFIG_BT_CONN_TX_MAX=10

# Storage & Settings
CONFIG_FLASH=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_CACHING=n

# Drivers
CONFIG_GPIO=y
CONFIG_ADC=y