CONFIG_PRINTK=y
CONFIG_LOG=y

# Bluetooth Core
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ESP32-DeskKnob"
CONFIG_BT_DEVICE_APPEARANCE=961

# Security & Bonding
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_NVS=y

# Drivers
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_ESP32=y